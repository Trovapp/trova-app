<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: 홈 화면 앱(standalone)에서 노치·홈 바 영역까지 앱 화면으로 쓴다(안전 영역은 앱이 맞춘다). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trova — 여행 영상으로 일정 만들기</title>
    <meta name="description" content="릴스·유튜브 여행 영상을 공유하면 장소와 일정을 정리해 드려요." />

    <!-- PWA(ADR 0013): 홈 화면에 추가하면 주소창 없는 전체 화면으로 열린다. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trova" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1F1E" media="(prefers-color-scheme: dark)" />

    <!-- 링크를 카톡·인스타 등에 보냈을 때의 미리보기 -->
    <meta property="og:title" content="Trova — 여행 영상으로 일정 만들기" />
    <meta property="og:description" content="릴스·유튜브 여행 영상을 공유하면 장소와 일정을 정리해 드려요." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* 앱이 뜨기 전에도 기기 화면 모드에 맞는 배경 — 다크 모드에서 흰 화면이 번쩍이지 않게(theme.ts bgMuted와 같은 값). */
        background: #f7f7f5;
      }
      :root {
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #121514;
        }
      }
      body {
        /* 웹은 한국어를 글자 단위로 줄바꿈해 "있어/요."처럼 끊겼다(2026-10-13 PWA QA) — 앱처럼 어절 단위로. 긴 링크는 아무 데서나 끊는다. */
        word-break: keep-all;
        overflow-wrap: anywhere;
        overflow: hidden;
        /* 길게 눌러 글자·이미지가 선택되거나 당겨서 새로고침되는 웹 느낌을 줄인다. */
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* 아이폰 Safari는 16px보다 작은 입력창에 들어가면 화면을 확대하고, 나와도 되돌리지 않는다(2026-10-13 PWA QA — 링크 입력이 14px).
         maximum-scale=1로 막으면 손가락 확대까지 막히므로(안드로이드) 입력창 글자를 16px 이상으로 둔다. */
      input,
      textarea,
      select {
        font-size: max(16px, 1em) !important;
      }
      /* 입력창을 누르면 브라우저 기본 파란 네모 테두리가 둥근 입력창 안에 어긋나게 그려졌다(2026-10-13 PWA QA 2회차).
         입력창마다 자체 테두리·강조색이 있어 기본 테두리는 끈다. */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* 시작 화면: 앱 코드·글꼴을 받는 동안(약 1초) 어두운 빈 화면만 보였다(2026-10-13 사용자: "케이뱅크처럼 하나의 화면").
         HTML이라 바로 보이고, 로그인 확인이 끝나면 앱이 지운다(src/lib/bootSplash.web.ts). 로그인 화면과 같은 로고·문구. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        background: #f7f7f5;
        color: #16211d;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
        transition: opacity 0.25s ease-out;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
        margin-bottom: 16px;
      }
      #boot-splash .name {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      #boot-splash .tagline {
        font-size: 15px;
        color: #5f5e5a;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #121514;
          color: #ecebe6;
        }
        #boot-splash .tagline {
          color: #a9a8a2;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Trova를 쓰려면 JavaScript를 켜 주세요.</noscript>
    <div id="boot-splash" aria-hidden="true">
      <img src="/icons/splash-icon.png" alt="" />
      <div class="name">Trova</div>
      <div class="tagline">여행 영상을 공유만 하면 장소와 일정까지 정리해드려요</div>
    </div>
    <div id="root"></div>
  </body>
</html>
